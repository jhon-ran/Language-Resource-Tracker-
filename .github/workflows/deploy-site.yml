name: Deploy site

# Builds /site with Astro and publishes it to GitHub Pages.
# One-time setup: Settings > Pages > Build and deployment > Source =
# "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "snapshots/**"
      - ".github/workflows/deploy-site.yml"
  # The weekly snapshot is pushed by snapshot.yml with GITHUB_TOKEN, and
  # GitHub does not start `push` workflows for commits made with that
  # token. So the `snapshots/**` path above only covers snapshots pushed
  # by a person; this trigger covers the automated ones. It fires when
  # the snapshot workflow finishes, whether it succeeded or not, because
  # a run with one failed fetcher still commits the others.
  workflow_run:
    workflows: ["Weekly snapshot"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Least privilege: read the repo, publish to Pages, and mint the OIDC
# token that actions/deploy-pages requires. No write access to contents.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A run already deploying is allowed to finish;
# only the newest waiting run is kept.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      stale: ${{ steps.fallback.outputs.stale }}
      detail: ${{ steps.fallback.outputs.detail }}
      used: ${{ steps.fallback.outputs.used }}
    defaults:
      run:
        working-directory: site
    steps:
      # On a workflow_run event this checks out the tip of main, which
      # already includes the snapshot commit.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `npm run build` is `astro check && astro build`: a type error,
      # including a key missing from one locale's dictionary, fails the
      # job before anything is deployed.
      - name: Type-check and build
        run: npm run build

      # The data build is lenient: if the newest snapshot folder is missing
      # a fetcher file it warns, falls back to the newest complete one and
      # lists what it passed over in home.json. Pick that up here so the
      # `snapshot-freshness` job below can fail the run.
      - name: Check for snapshot fallback
        id: fallback
        run: |
          node -e '
            const h = JSON.parse(require("fs").readFileSync("src/data/home.json", "utf8"));
            const f = h.snapshot_fallback;
            if (!Array.isArray(f)) { console.error("home.json has no snapshot_fallback list"); process.exit(1); }
            const msg = f.map((s) => `snapshots/${s.folder} (missing ${s.missing.join(", ")})`).join("; ");
            console.log(`stale=${f.length > 0}`);
            console.log(`detail=${msg}`);
            console.log(`used=snapshots/${h.snapshot_folder}, measured ${h.snapshot_measured_at}`);
          ' >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Runs after the deploy, so the site still gets the fallback build (and
  # any site changes in the same push), but the run as a whole fails and
  # GitHub sends its failed-workflow notification. A stale site should
  # never be a silent one.
  snapshot-freshness:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if the build fell back to an older snapshot
        env:
          STALE: ${{ needs.build.outputs.stale }}
          DETAIL: ${{ needs.build.outputs.detail }}
          USED: ${{ needs.build.outputs.used }}
        run: |
          if [ "$STALE" = "true" ]; then
            echo "::error title=Site deployed from an older snapshot::Newer snapshot incomplete: $DETAIL. Site was built from $USED."
            exit 1
          fi
          if [ "$STALE" != "false" ]; then
            echo "::error::Snapshot fallback status missing from the build job."
            exit 1
          fi
          echo "Latest snapshot is complete: $USED"
