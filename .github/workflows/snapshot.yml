# Weekly snapshot: runs the five weekly fetchers and commits a new dated
# folder under snapshots/. sources/inegi.py is deliberately NOT run here;
# it is a one-time loader for the static census reference layer.
#
# NEEDS ON YOUR SIDE (nothing else is required; no secret is embedded):
#   1. The commit-back uses GitHub Actions' own GITHUB_TOKEN. The
#      `permissions: contents: write` block below is what lets it push.
#      If Settings > Actions > General > Workflow permissions is locked to
#      read-only by an organisation policy, the push step fails with 403.
#   2. If `main` has a branch protection rule or ruleset that requires pull
#      requests or status checks, the push is rejected. Either leave `main`
#      unprotected or add a bypass for GitHub Actions.
#   3. Scheduled runs only fire from the default branch, and GitHub pauses
#      schedules after 60 days without repository activity. The weekly
#      commit itself counts as activity.
#   4. Optional: add a repository secret HF_TOKEN (a read-only Hugging Face
#      token) if anonymous rate limits slow the run. It works without one.

name: Weekly snapshot

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      date:
        description: "Snapshot folder name, YYYY-MM-DD (default: today, UTC)"
        required: false
        default: ""
      overwrite:
        description: "Replace the folder if it already exists"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ github.token }}      # raises the GitHub API rate limit for the fetchers
      HF_TOKEN: ${{ secrets.HF_TOKEN }}      # optional; empty if the secret is not set
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # fetchers use the standard library only

      - name: Cache the pinned Glottolog release
        uses: actions/cache@v4
        with:
          path: .cache/glottolog-cldf-*
          key: glottolog-${{ hashFiles('tools/build_crosswalk.py') }}

      - name: Choose the snapshot date
        id: date
        env:
          INPUT_DATE: ${{ inputs.date }}
          OVERWRITE: ${{ inputs.overwrite }}
        run: |
          DATE="${INPUT_DATE:-$(date -u +%F)}"
          if ! echo "$DATE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::date must be YYYY-MM-DD, got '$DATE'"; exit 1
          fi
          # Snapshots are append-only: never replace an existing folder by accident.
          if [ -d "snapshots/$DATE" ] && [ "$OVERWRITE" != "true" ]; then
            echo "::error::snapshots/$DATE already exists. Re-run with overwrite ticked, or give another date."; exit 1
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Run the fetchers
        id: fetch
        env:
          DATE: ${{ steps.date.outputs.date }}
        run: |
          failed=""
          for source in glottolog huggingface common_voice universal_dependencies omnilingual_asr; do
            echo "::group::$source"
            python3 "sources/$source.py" --date "$DATE" || failed="$failed $source"
            echo "::endgroup::"
          done
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Commit the snapshot
        env:
          DATE: ${{ steps.date.outputs.date }}
          FAILED: ${{ steps.fetch.outputs.failed }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "snapshots/$DATE"
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            MESSAGE="Snapshot $DATE"
            [ -n "$FAILED" ] && MESSAGE="$MESSAGE (incomplete: failed$FAILED)"
            git commit -m "$MESSAGE"
            git push
          fi

      - name: Fail the run if any fetcher failed
        if: steps.fetch.outputs.failed != ''
        run: |
          echo "::error::fetchers failed:${{ steps.fetch.outputs.failed }}"
          exit 1
